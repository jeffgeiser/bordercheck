[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bordercheck"
version = "0.1.0"
description = "Follow a synthetic customer through your AI stack and see where the data lands."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = { text = "Apache-2.0" }

[project.scripts]
bordercheck = "bordercheck.cli:main"

[tool.setuptools]
packages = ["bordercheck"]
