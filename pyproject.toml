[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bordercheck"
dynamic = ["version"]
description = "Follow a synthetic customer through your AI stack and see where the data lands."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jeff Geiser" }]
keywords = ["data-residency", "llm", "ai-gateway", "privacy", "gdpr", "dora", "compliance", "pii", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/jeffgeiser/bordercheck"
Source = "https://github.com/jeffgeiser/bordercheck"
Issues = "https://github.com/jeffgeiser/bordercheck/issues"
Changelog = "https://github.com/jeffgeiser/bordercheck/blob/main/CHANGELOG.md"

[project.scripts]
bordercheck = "bordercheck.cli:main"

[tool.setuptools]
packages = ["bordercheck"]

[tool.setuptools.dynamic]
version = { attr = "bordercheck.__version__" }
